[project]
name = "attention-non-collapse"
version = "0.1.0"
description = "ICLR 2027 experiments for spectral rank in causal token mixers"
readme = "README.md"
requires-python = ">=3.14.0"
dependencies = [
    "accelerate>=1.0.1",
    "fla-core>=0.5.1",
    "flash-linear-attention==0.5.1",
    "matplotlib>=3.7.5",
    "numpy>=1.24.4",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "protobuf>=5.29.0",
    "sentencepiece>=0.2.0",
    "tiktoken>=0.7.0",
    "torch>=2.5.1",
    "transformers==4.57.1",
]
[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
